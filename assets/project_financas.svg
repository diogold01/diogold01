<svg xmlns="http://www.w3.org/2000/svg" width="430" height="230" viewBox="0 0 430 230">
  <defs>
    <!-- Fundo Escuro do Card -->
    <linearGradient id="fCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <!-- Shimmer no Título -->
    <linearGradient id="fShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .f-glow { animation: fGlow 3s infinite alternate; }
    @keyframes fGlow { 0% { stroke: #1e293b; } 100% { stroke: #0ea5e9; } }
  </style>

  <rect width="430" height="230" rx="14" fill="url(#fCardBg)"/>
  <rect width="428" height="228" x="1" y="1" rx="13" fill="none" class="f-glow" stroke-width="1.2"/>

  <!-- Header do Card -->
  <g transform="translate(24, 28)">
    <circle cx="8" cy="8" r="4" fill="#10b981"/>
    <text x="20" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1">
      DESKTOP APP &bull; CLEAN ARCH
    </text>
  </g>

  <!-- Título do Projeto -->
  <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="url(#fShimmer)">
    Minhas Finanças (Plutos)
  </text>

  <!-- Descrição -->
  <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
    Sistema desktop para gestão financeira pessoal,
  </text>
  <text x="24" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
    controle orçamentário e análise de fluxo de caixa.
  </text>

  <!-- Chips de Stack -->
  <g transform="translate(24, 155)">
    <rect width="66" height="22" rx="4" fill="#0b1220" stroke="#1e293b"/>
    <text x="33" y="15" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="10" fill="#38bdf8">Python</text>

    <rect x="74" width="60" height="22" rx="4" fill="#0b1220" stroke="#1e293b"/>
    <text x="104" y="15" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="10" fill="#38bdf8">Pytest</text>

    <rect x="142" width="96" height="22" rx="4" fill="#0b1220" stroke="#1e293b"/>
    <text x="190" y="15" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="10" fill="#38bdf8">Clean Arch</text>

    <rect x="246" width="84" height="22" rx="4" fill="#0b1220" stroke="#1e293b"/>
    <text x="288" y="15" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="10" fill="#38bdf8">Desktop</text>
  </g>

  <!-- Link Footer -->
  <line x1="24" y1="192" x2="406" y2="192" stroke="#1e293b" stroke-width="1"/>
  <text x="24" y="212" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600" fill="#64748b">
    github.com/diogold01 ↗
  </text>
</svg>
