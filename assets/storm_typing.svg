<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 80" width="900" height="80" role="img" aria-label="Console de status: Estudante de Engenharia de Software | Construindo ferramentas práticas com IA, SQL e automação | Suporte ERP, Fiscal e Análise de Dados">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1a30"/><stop offset="1" stop-color="#050914"/></linearGradient>
</defs>
<style>
.mono{font-family:'Courier New',monospace}
.sig{animation:sig 1.6s steps(1,end) infinite}
@keyframes sig{0%{opacity:1}50%{opacity:.25}}
.scan{animation:scan 4s steps(12,end) infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(42px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="80" rx="6" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="899" height="79" rx="6" fill="none" stroke="#1d5f99" stroke-width="1"/>
<rect x="0" y="0" width="900" height="30" rx="6" fill="#0f1930"/>
<rect x="0" y="24" width="900" height="6" fill="#0f1930"/>
<rect x="16" y="11" width="8" height="8" fill="#22355e"/>
<rect x="30" y="11" width="8" height="8" fill="#22355e"/>
<rect x="44" y="11" width="8" height="8" fill="#4cc2ff"/>
<text class="mono" x="66" y="20" font-size="13" fill="#7fa3d6" letter-spacing="2">STORM-RADAR ~ STATUS CONSOLE</text>
<text class="sig mono" x="860" y="20" font-size="12" fill="#4cc2ff" text-anchor="end" letter-spacing="2">FEED: LIVE</text>
<g opacity=".08"><rect class="scan" x="0" y="32" width="900" height="4" fill="#4cc2ff"/></g>

<g class="mono" font-size="14" letter-spacing="1">
<text x="36" y="58" fill="#4a6fa5">CONSOLE &gt;</text>

<path id="p0">
<animate id="d0" attributeName="d" begin="0s;d2.end" dur="4200ms" fill="remove" values="m130,58 h0 ; m130,58 h720 ; m130,58 h720 ; m130,58 h0" keyTimes="0;0.55;0.85;1" />
</path>
<text fill="#e0f2fe">
<textPath href="#p0" xlink:href="#p0">Estudante de Engenharia de Software</textPath>
</text>

<path id="p1">
<animate id="d1" attributeName="d" begin="d0.end" dur="4800ms" fill="remove" values="m130,58 h0 ; m130,58 h720 ; m130,58 h720 ; m130,58 h0" keyTimes="0;0.55;0.85;1" />
</path>
<text fill="#4cc2ff">
<textPath href="#p1" xlink:href="#p1">Construindo ferramentas práticas com IA, SQL e automação</textPath>
</text>

<path id="p2">
<animate id="d2" attributeName="d" begin="d1.end" dur="4200ms" fill="remove" values="m130,58 h0 ; m130,58 h720 ; m130,58 h720 ; m130,58 h0" keyTimes="0;0.55;0.85;1" />
</path>
<text fill="#e0f2fe">
<textPath href="#p2" xlink:href="#p2">Suporte ERP, Fiscal e Análise de Dados</textPath>
</text>
</g>
</svg>
