<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130">
  <defs>
    <!-- Fundo do Rodapé -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Linha de Horizonte Brilhante -->
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0; 0.5 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Shimmer no Texto -->
    <linearGradient id="ftTextShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#94a3b8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .pulse-dot { animation: pDot 2s infinite ease-in-out; }
    @keyframes pDot { 0%, 100% { opacity: 0.5; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } }
  </style>

  <!-- Corpo do Card -->
  <rect width="900" height="130" rx="14" fill="url(#footerBg)"/>
  <rect width="898" height="128" x="1" y="1" rx="13" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Linha Superior de Luz -->
  <line x1="80" y1="1" x2="820" y2="1" stroke="url(#horizonGlow)" stroke-width="1.5"/>

  <!-- Elemento Central -->
  <g transform="translate(450, 48)">
    <circle cx="0" cy="0" r="4" fill="#38bdf8" class="pulse-dot"/>
    <circle cx="-30" cy="0" r="2" fill="#334155"/>
    <circle cx="30" cy="0" r="2" fill="#334155"/>
  </g>

  <!-- Assinatura Central -->
  <text x="450" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="url(#ftTextShimmer)" letter-spacing="3">
    ✦ DESIGNED &amp; ENGINEERED BY DIOGO &#8226; ALL SYSTEMS OPERATIONAL ✦
  </text>

  <!-- Tagline Inferior -->
  <text x="450" y="104" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="10" font-weight="400" fill="#475569" letter-spacing="1.5">
    &lt; STAY CURIOUS &#8226; BUILD THINGS THAT MATTER /&gt;
  </text>
</svg>
