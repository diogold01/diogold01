<rect class="flash-line" x="20" y="28" width="400" height="1.5" fill="url(#bolt)"/>

<text class="sans" x="22" y="64" font-size="21" font-weight="800" fill="#ffffff" letter-spacing="0.5">Pechincha</text>
<text class="sans" x="22" y="92" font-size="12.5" fill="#94a3b8">Controle colaborativo de compras de mercado,</text>
<text class="sans" x="22" y="111" font-size="12.5" fill="#94a3b8">histórico de preços e orçamento mensal por setor.</text>

<rect x="22" y="136" width="75" height="22" fill="#0c1a30" stroke="#1d5f99"/>
