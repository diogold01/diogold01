<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 205" width="440" height="205" role="img" aria-label="Pechincha — Controle colaborativo de compras de mercado, histórico de preços e orçamento mensal por setor.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1a30"/><stop offset="1" stop-color="#050914"/></linearGradient>
<linearGradient id="bolt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4cc2ff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/><stop offset="1" stop-color="#4cc2ff" stop-opacity="0"/></linearGradient>
</defs>
<style>
.mono{font-family:'Courier New',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.sig{animation:sig 1.8s steps(1,end) infinite;animation-delay:1.1s}
@keyframes sig{0%{opacity:1}50%{opacity:.3}}
.flash-line{opacity:0;animation:fline 4.5s steps(1,end) infinite;animation-delay:1.1s}
@keyframes fline{0%{opacity:0}82%{opacity:1}85%{opacity:.2}88%{opacity:1}92%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="440" height="205" rx="6" fill="url(#bg)"/>
