<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <!-- Gradiente de Fundo Profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d121f"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>

    <!-- Spotlight Superior Suave -->
    <radialGradient id="topSpotlight" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#0ea5e9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080b14" stop-opacity="0"/>
    </radialGradient>

    <!-- Shimmer Metálico no Título Diogo -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="38%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="62%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f8fafc"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Gradiente da Borda Suave -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .pulse-status { animation: pDot 2.5s infinite ease-in-out; }
    @keyframes pDot { 0%, 100% { opacity: 0.5; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); } }
    
    .glow-line { animation: gLine 4s infinite alternate ease-in-out; }
    @keyframes gLine { 0% { opacity: 0.4; } 100% { opacity: 0.9; } }

    .fade-up { animation: fUp 1s ease-out both; }
    @keyframes fUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <!-- Fundo com Borda Arredondada -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect width="900" height="240" rx="16" fill="url(#topSpotlight)"/>
  <rect width="898" height="238" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Feixe Superior de Luz (Top Spotlight Beam) -->
  <line x1="280" y1="1" x2="620" y2="1" stroke="#38bdf8" stroke-width="2" class="glow-line"/>

  <!-- Badge de Status Central Superior -->
  <g transform="translate(370, 36)" class="fade-up">
    <rect width="160" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="13" r="3.5" fill="#38bdf8" class="pulse-status" style="transform-origin: 18px 13px;"/>
    <text x="30" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">
      DIOGO &#8226; DEV
    </text>
  </g>

  <!-- Título Principal -->
  <text x="450" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="url(#shimmer)" letter-spacing="2">
    Diogo
  </text>

  <!-- Subtítulo / Especialidades -->
  <text x="450" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="2.5">
    SOFTWARE DEVELOPER &#8226; NEXT.JS &#8226; PYTHON &#8226; FULL STACK
  </text>

  <!-- Marcadores Sutis Inferiores -->
  <g transform="translate(420, 198)">
    <circle cx="0" cy="0" r="2" fill="#334155"/>
    <circle cx="15" cy="0" r="2" fill="#334155"/>
    <circle cx="30" cy="0" r="2.5" fill="#38bdf8" class="pulse-status" style="transform-origin: 30px 0px;"/>
    <circle cx="45" cy="0" r="2" fill="#334155"/>
    <circle cx="60" cy="0" r="2" fill="#334155"/>
  </g>
</svg>
