<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210">
  <defs>
    <!-- Fundo Escuro Metálico do Card -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <!-- Borda com Glow Discreto -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <style>
    .blinker { animation: bCursor 1.1s infinite steps(1); }
    @keyframes bCursor { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    
    .status-dot { animation: sDot 2s infinite ease-in-out; }
    @keyframes sDot { 0%, 100% { opacity: 0.6; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); } }
  </style>

  <!-- Corpo do Card -->
  <rect width="900" height="210" rx="14" fill="url(#cardBg)"/>
  <rect width="898" height="208" x="1" y="1" rx="13" fill="none" stroke="url(#cardBorder)" stroke-width="1.2"/>

  <!-- Barra Superior do Terminal -->
  <line x1="1" y1="40" x2="899" y2="40" stroke="#1e293b" stroke-width="1"/>
  <circle cx="26" cy="20" r="4.5" fill="#ef4444" opacity="0.85"/>
  <circle cx="42" cy="20" r="4.5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="58" cy="20" r="4.5" fill="#10b981" opacity="0.85"/>
  
  <text x="82" y="24" font-family="'Fira Code', 'Courier New', monospace" font-size="12" font-weight="600" fill="#64748b">
    diogo@system:~$ fetch --summary
  </text>
  <rect x="306" y="14" width="7" height="13" fill="#38bdf8" class="blinker"/>

  <!-- Grid com 4 Quadrantes Técnicos -->
  
  <!-- Quadrante 1: Foco Principal -->
  <g transform="translate(40, 62)">
    <rect width="395" height="56" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">
      ⚡ FOCO PRINCIPAL
    </text>
    <text x="18" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">
      Engenharia de Software &amp; Aplicações Full Stack
    </text>
  </g>

  <!-- Quadrante 2: Core Stack -->
  <g transform="translate(465, 62)">
    <rect width="395" height="56" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">
      🛠️ CORE STACK
    </text>
    <text x="18" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">
      Next.js &#8226; TypeScript &#8226; Python &#8226; Tailwind CSS
    </text>
  </g>

  <!-- Quadrante 3: Princípios de Engenharia -->
  <g transform="translate(40, 134)">
    <rect width="395" height="56" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">
      📐 ARQUITETURA &amp; PRINCÍPIOS
    </text>
    <text x="18" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">
      Clean Code, Mínima Fricção &amp; Alta Performance
    </text>
  </g>

  <!-- Quadrante 4: Atuação & Localização -->
  <g transform="translate(465, 134)">
    <rect width="395" height="56" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="24" cy="21" r="3.5" fill="#10b981" class="status-dot" style="transform-origin: 24px 21px;"/>
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#10b981" letter-spacing="1">
      ATUAÇÃO &amp; LOCALIZAÇÃO
    </text>
    <text x="18" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">
      Coliseu Sistemas &#8226; Dourados / MS
    </text>
  </g>
</svg>
