<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130" role="img" aria-label="Diogo Duarte — Analista de TI — Coliseu Sistemas • Dourados, MS, Brasil">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050914"/><stop offset="1" stop-color="#0c1a30"/></linearGradient>
<radialGradient id="hGlow" cx="50%" cy="0%" r="55%"><stop offset="0" stop-color="#4cc2ff" stop-opacity=".28"/><stop offset="1" stop-color="#4cc2ff" stop-opacity="0"/></radialGradient>
</defs>
<style>
.mono{font-family:'Courier New',monospace}
.flashL{opacity:0;animation:fL 5s steps(1,end) infinite}
@keyframes fL{0%{opacity:0}60%{opacity:1}62%{opacity:.2}64%{opacity:1}68%{opacity:0}100%{opacity:0}}
.flashR{opacity:0;animation:fR 6s steps(1,end) infinite;animation-delay:2.1s}
@keyframes fR{0%{opacity:0}72%{opacity:1}74%{opacity:.3}76%{opacity:1}80%{opacity:0}100%{opacity:0}}
.rain1{animation:rFall 1.1s steps(6,end) infinite}
.rain2{animation:rFall 1.1s steps(6,end) infinite;animation-delay:.55s}
@keyframes rFall{from{transform:translate(0,-14px)}to{transform:translate(-10px,26px)}}
.cur{animation:blink 1s steps(1,end) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="130" rx="6" fill="url(#bg)"/>
<rect width="900" height="130" rx="6" fill="url(#hGlow)"/>
<rect x="0.5" y="0.5" width="899" height="129" rx="6" fill="none" stroke="#1d5f99" stroke-width="1"/>

<g shape-rendering="crispEdges">
<rect x="0" y="0" width="900" height="10" fill="#0f1930"/>
<rect x="40" y="10" width="120" height="6" fill="#142140"/>
<rect x="210" y="10" width="180" height="6" fill="#18284a"/>
<rect x="460" y="10" width="160" height="6" fill="#142140"/>
<rect x="680" y="10" width="170" height="6" fill="#18284a"/>

<g class="rain1" fill="#22355e">
<rect x="90" y="18" width="2" height="8"/><rect x="230" y="24" width="2" height="8"/><rect x="370" y="16" width="2" height="8"/><rect x="540" y="22" width="2" height="8"/><rect x="700" y="18" width="2" height="8"/><rect x="820" y="24" width="2" height="8"/>
</g>
<g class="rain2" fill="#1d5f99">
<rect x="150" y="20" width="2" height="8"/><rect x="300" y="16" width="2" height="8"/><rect x="610" y="20" width="2" height="8"/><rect x="760" y="16" width="2" height="8"/>
</g>

<g class="flashL">
<rect x="140" y="10" width="6" height="8" fill="#ffffff"/>
<rect x="136" y="18" width="6" height="8" fill="#ffffff"/>
<rect x="140" y="26" width="6" height="8" fill="#4cc2ff"/>
<rect x="136" y="34" width="4" height="8" fill="#4cc2ff"/>
</g>
<g class="flashR">
<rect x="760" y="10" width="6" height="8" fill="#ffffff"/>
<rect x="764" y="18" width="6" height="8" fill="#ffffff"/>
<rect x="758" y="26" width="6" height="8" fill="#4cc2ff"/>
<rect x="762" y="34" width="4" height="8" fill="#4cc2ff"/>
</g>
</g>

<text class="mono" x="450" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#e0f2fe" letter-spacing="3">DIOGO DUARTE &#8226; ANALISTA DE TI</text>
<text class="mono" x="450" y="88" text-anchor="middle" font-size="11.5" fill="#4cc2ff" letter-spacing="2">COLISEU SISTEMAS &#8226; DOURADOS, MS, BRASIL &#8226; PYTHON &amp; TYPESCRIPT</text>

<g shape-rendering="crispEdges">
<rect x="0" y="116" width="900" height="14" fill="#060c18"/>
<rect x="0" y="114" width="900" height="2" fill="#142140"/>
<rect class="cur" x="442" y="104" width="16" height="4" fill="#4cc2ff"/>
</g>
</svg>
