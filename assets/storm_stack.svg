<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 188" width="900" height="188" role="img" aria-label="Stack: Gemini API, SQL, Excel, Python, JavaScript, HTML / CSS, SQLite, Supabase, Git / GitHub">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1a30"/><stop offset="1" stop-color="#050914"/></linearGradient></defs>
<style>
.mono{font-family:'Courier New',monospace}
.chip{animation:chip 4.2s steps(1,end) infinite}
@keyframes chip{0%{opacity:1}92%{opacity:1}94%{opacity:.45}96%{opacity:1}98%{opacity:.7}100%{opacity:1}}
.sig{animation:sig 1.6s steps(1,end) infinite}
@keyframes sig{0%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="188" rx="6" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="899" height="187" rx="6" fill="none" stroke="#1d5f99"/>
<rect width="900" height="30" rx="6" fill="#0f1930"/><rect y="24" width="900" height="6" fill="#0f1930"/>
<rect x="16" y="11" width="8" height="8" fill="#22355e"/><rect x="30" y="11" width="8" height="8" fill="#22355e"/><rect x="44" y="11" width="8" height="8" fill="#4cc2ff"/>
<text class="mono" x="66" y="20" font-size="13" fill="#7fa3d6" letter-spacing="2">STORM-RADAR ~ TECH STACK</text>
<text class="sig mono" x="860" y="20" font-size="12" fill="#4cc2ff" text-anchor="end" letter-spacing="2">CHARGE: ACTIVE</text>

<!-- LINHA 1: IA & DADOS -->
<text class="mono" x="30" y="79" font-size="11" fill="#4a6fa5" letter-spacing="1.5">IA &amp; DADOS</text>
<g class="chip" style="animation-delay:0.0s"><rect x="210" y="62" width="122" height="26" fill="#0c1a30" stroke="#1d5f99"/><rect x="210" y="62" width="4" height="26" fill="#4cc2ff"/><text class="mono" x="226" y="80" font-size="14" fill="#e0f2fe" letter-spacing="1">Gemini API</text></g>
<g class="chip" style="animation-delay:0.6s"><rect x="344" y="62" width="58" height="26" fill="#0c1a30" stroke="#1d5f99"/><rect x="344" y="62" width="4" height="26" fill="#4cc2ff"/><text class="mono" x="360" y="80" font-size="14" fill="#e0f2fe" letter-spacing="1">SQL</text></g>
<g class="chip" style="animation-delay:1.2s"><rect x="414" y="62" width="76" height="26" fill="#0c1a30" stroke="#1d5f99"/><rect x="414" y="62" width="4" height="26" fill="#4cc2ff"/><text class="mono" x="430" y="80" font-size="14" fill="#e0f2fe" letter-spacing="1">Excel</text></g>

<!-- LINHA 2: DESENVOLVIMENTO -->
<text class="mono" x="30" y="119" font-size="11" fill="#4a6fa5" letter-spacing="1">DESENVOLVIMENTO</text>
<g class="chip" style="animation-delay:2.4s"><rect x="210" y="102" width="82" height="26" fill="#0c1a30" stroke="#1d5f99"/><rect x="210" y="102" width="4" height="26" fill="#4cc2ff"/><text class="mono" x="226" y="120" font-size="14" fill="#e0f2fe" letter-spacing="1">Python</text></g>
<g class="chip" style="animation-delay:3.0s"><rect x="304" y="102" width="120" height="26" fill="#0c1a30" stroke="#1d5f99"/><rect x="304" y="102" width="4" height="26" fill="#4cc2ff"/><text class="mono" x="320" y="120" font-size="14" fill="#e0f2fe" letter-spacing="1">JavaScript</text></g>
<g class="chip" style="animation-delay:3.6s"><rect x="436" y="102" width="120" height="26" fill="#0c1a30" stroke="#1d5f99"/><rect x="436" y="102" width="4" height="26" fill="#4cc2ff"/><text class="mono" x="452" y="120" font-size="14" fill="#e0f2fe" letter-spacing="1">HTML / CSS</text></g>

<!-- LINHA 3: BANCO & VERSIONAMENTO -->
<text class="mono" x="30" y="159" font-size="11" fill="#4a6fa5" letter-spacing="1">BANCO &amp; GIT</text>
<g class="chip" style="animation-delay:0.9s"><rect x="210" y="142" width="82" height="26" fill="#0c1a30" stroke="#1d5f99"/><rect x="210" y="142" width="4" height="26" fill="#4cc2ff"/><text class="mono" x="226" y="160" font-size="14" fill="#e0f2fe" letter-spacing="1">SQLite</text></g>
<g class="chip" style="animation-delay:1.5s"><rect x="304" y="142" width="102" height="26" fill="#0c1a30" stroke="#1d5f99"/><rect x="304" y="142" width="4" height="26" fill="#4cc2ff"/><text class="mono" x="320" y="160" font-size="14" fill="#e0f2fe" letter-spacing="1">Supabase</text></g>
<g class="chip" style="animation-delay:2.1s"><rect x="418" y="142" width="138" height="26" fill="#0c1a30" stroke="#1d5f99"/><rect x="418" y="142" width="4" height="26" fill="#4cc2ff"/><text class="mono" x="434" y="160" font-size="14" fill="#e0f2fe" letter-spacing="1">Git / GitHub</text></g>
