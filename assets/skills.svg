<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230">
  <defs>
    <!-- Fundo do Card -->
    <linearGradient id="skillsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <!-- Gradiente das Barras -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Brilho deslizante animado nas barras -->
    <linearGradient id="barGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="2.8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .p-node { animation: nodePulse 1.8s infinite ease-in-out; }
    @keyframes nodePulse { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.3); opacity: 1; } }
  </style>

  <!-- Fundo do Card -->
  <rect width="900" height="230" rx="14" fill="url(#skillsBg)"/>
  <rect width="898" height="228" x="1" y="1" rx="13" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Header interno -->
  <text x="40" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
    // TECH STACK & PROFICIENCY MATRIX
  </text>
  <line x1="40" y1="46" x2="860" y2="46" stroke="#1e293b" stroke-width="1"/>

  <!-- Coluna 1: Frontend & UI -->
  <g transform="translate(40, 68)">
    <!-- Skill 1 -->
    <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Next.js & React</text>
    <text x="390" y="12" text-anchor="end" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="bold" fill="#38bdf8">95%</text>
    <rect x="0" y="20" width="390" height="8" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <rect x="0" y="20" width="370" height="8" rx="4" fill="url(#barGrad)"/>
    <rect x="0" y="20" width="370" height="8" rx="4" fill="url(#barGlow)"/>
    <circle cx="370" cy="24" r="3" fill="#ffffff" class="p-node" style="transform-origin: 370px 24px;"/>

    <!-- Skill 2 -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">TypeScript & Modern JavaScript</text>
    <text x="390" y="58" text-anchor="end" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="bold" fill="#38bdf8">90%</text>
    <rect x="0" y="66" width="390" height="8" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <rect x="0" y="66" width="351" height="8" rx="4" fill="url(#barGrad)"/>
    <rect x="0" y="66" width="351" height="8" rx="4" fill="url(#barGlow)"/>
    <circle cx="351" cy="70" r="3" fill="#ffffff" class="p-node" style="transform-origin: 351px 70px; animation-delay: 0.3s;"/>

    <!-- Skill 3 -->
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Tailwind CSS & Component Architecture</text>
    <text x="390" y="104" text-anchor="end" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="bold" fill="#38bdf8">92%</text>
    <rect x="0" y="112" width="390" height="8" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <rect x="0" y="112" width="358" height="8" rx="4" fill="url(#barGrad)"/>
    <rect x="0" y="112" width="358" height="8" rx="4" fill="url(#barGlow)"/>
    <circle cx="358" cy="116" r="3" fill="#ffffff" class="p-node" style="transform-origin: 358px 116px; animation-delay: 0.6s;"/>
  </g>

  <!-- Coluna 2: Backend, Dados & Tooling -->
  <g transform="translate(470, 68)">
    <!-- Skill 4 -->
    <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Python (Desktop, Automações & APIs)</text>
    <text x="390" y="12" text-anchor="end" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="bold" fill="#38bdf8">88%</text>
    <rect x="0" y="20" width="390" height="8" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <rect x="0" y="20" width="343" height="8" rx="4" fill="url(#barGrad)"/>
    <rect x="0" y="20" width="343" height="8" rx="4" fill="url(#barGlow)"/>
    <circle cx="343" cy="24" r="3" fill="#ffffff" class="p-node" style="transform-origin: 343px 24px; animation-delay: 0.2s;"/>

    <!-- Skill 5 -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Banco de Dados & Supabase / SQL</text>
    <text x="390" y="58" text-anchor="end" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="bold" fill="#38bdf8">85%</text>
    <rect x="0" y="66" width="390" height="8" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <rect x="0" y="66" width="331" height="8" rx="4" fill="url(#barGrad)"/>
    <rect x="0" y="66" width="331" height="8" rx="4" fill="url(#barGlow)"/>
    <circle cx="331" cy="70" r="3" fill="#ffffff" class="p-node" style="transform-origin: 331px 70px; animation-delay: 0.5s;"/>

    <!-- Skill 6 -->
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Git, Docker & Cloud Deployment (Vercel)</text>
    <text x="390" y="104" text-anchor="end" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="bold" fill="#38bdf8">90%</text>
    <rect x="0" y="112" width="390" height="8" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <rect x="0" y="112" width="351" height="8" rx="4" fill="url(#barGrad)"/>
    <rect x="0" y="112" width="351" height="8" rx="4" fill="url(#barGlow)"/>
    <circle cx="351" cy="116" r="3" fill="#ffffff" class="p-node" style="transform-origin: 351px 116px; animation-delay: 0.8s;"/>
  </g>
</svg>
